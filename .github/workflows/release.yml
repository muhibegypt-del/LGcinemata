name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0); creates tag v<version>'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          V="${V#v}"
          # webOS needs MAJOR.MINOR.PATCH; pad short input like "1" or "1.2"
          while [[ "$V" =~ ^[0-9]+(\.[0-9]+)?$ ]]; do V="$V.0"; done
          if ! [[ "$V" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '$V' must look like 1.0.0"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set version in appinfo.json
        run: jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' app/appinfo.json > tmp.json && mv tmp.json app/appinfo.json

      - name: Install ares-cli
        run: npm i -g @webosose/ares-cli

      - name: Build
        run: make build

      - name: Package
        run: make package

      - name: Generate manifest
        run: |
          IPK="io.strem.tv_${{ steps.version.outputs.version }}_all.ipk"
          SHA256=$(sha256sum "$IPK" | cut -d' ' -f1)
          SIZE=$(stat --format=%s "$IPK")
          cat > manifest.json << EOF
          {
            "id": "io.strem.tv",
            "version": "${{ steps.version.outputs.version }}",
            "type": "web",
            "title": "Stremio",
            "iconUri": "https://raw.githubusercontent.com/${{ github.repository }}/main/app/icon.png",
            "sourceUrl": "https://github.com/${{ github.repository }}",
            "rootRequired": false,
            "ipkUrl": "$IPK",
            "ipkHash": {
              "sha256": "$SHA256"
            },
            "ipkSize": $SIZE
          }
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            io.strem.tv_${{ steps.version.outputs.version }}_all.ipk
            manifest.json
